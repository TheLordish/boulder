name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Assemble web layer
        run: |
          mkdir -p www
          cp -r index.html css js icons manifest.webmanifest sw.js www/
          if [ -d data ]; then cp -r data www/; fi
          node -e "const f='capacitor.config.json',c=JSON.parse(require('fs').readFileSync(f));c.server={url:'https://${{ github.repository_owner }}.github.io/boulder/',androidScheme:'https'};require('fs').writeFileSync(f,JSON.stringify(c,null,2));console.log('points at',c.server.url)"

      - name: Add Android
        run: npx cap add android

      - name: Patch
        run: node scripts/patch-android.js

      - name: Sync
        run: npx cap sync android

      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          find . -name "*.apk" -exec cp {} ../boulder.apk \;

      - uses: actions/upload-artifact@v4
        with:
          name: boulder-apk
          path: boulder.apk
